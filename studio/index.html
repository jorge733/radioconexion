<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#f4f6f8"
  >

  <title>Radio Conexión Studio</title>

  <meta
    name="description"
    content="Radio Conexión Studio - Plataforma de producción de Radio Conexión."
  >

  <!-- FAVICON OFICIAL DE RADIO CONEXIÓN -->
  <link
    rel="icon"
    type="image/png"
    href="https://www.dropbox.com/scl/fi/7h2pubomnn102d1rap4dr/Sin-Texto-versi-n-3D.png?rlkey=nd66shyykgea25m8c6sl2pp5d&st=dg874wjl&raw=1"
  >

  <!-- ESTILOS -->
  <link
    rel="stylesheet"
    href="./studio.css"
  >
</head>


<body>

  <!-- =====================================================
       CABECERA RADIO CONEXIÓN STUDIO
  ====================================================== -->

  <header class="topbar">

    <div class="studio-brand">

      <a
        class="studio-logo"
        href="/inicio.html"
        title="Ir a Radio Conexión"
        aria-label="Radio Conexión"
      >
        <img
          src="https://www.dropbox.com/scl/fi/7h2pubomnn102d1rap4dr/Sin-Texto-versi-n-3D.png?rlkey=nd66shyykgea25m8c6sl2pp5d&raw=1"
          alt="Radio Conexión"
        >
      </a>


      <div class="studio-brand-text">

        <span class="brand-name">
          Radio Conexión
        </span>

        <div class="studio-title-row">

          <span class="studio-title">
            Studio
          </span>

          <span class="studio-badge">
            PRODUCCIÓN
          </span>

        </div>

        <span class="brand-tagline">
          Conectados Con Tus Sentidos
        </span>

      </div>

    </div>


    <div class="topbar-actions">

      <div
        class="save-status"
        id="saveStatus"
      >
        ● Guardado
      </div>


      <a
        class="back-site-button"
        href="/inicio.html"
      >
        <span aria-hidden="true">←</span>
        <span>Volver a Radio Conexión</span>
      </a>

    </div>

  </header>


  <!-- =====================================================
       CONTENIDO PRINCIPAL
  ====================================================== -->

  <main class="studio-container">


    <!-- ===================================================
         INFORMACIÓN DEL EPISODIO
    ==================================================== -->

    <section class="episode-header panel">

      <div class="field episode-number-field">

        <label for="episodeNumber">
          EPISODIO
        </label>

        <input
          id="episodeNumber"
          type="number"
          min="1"
          value="98"
          autocomplete="off"
        >

      </div>


      <div class="field episode-title-field">

        <label for="episodeTitle">
          TEMA / TÍTULO
        </label>

        <input
          id="episodeTitle"
          type="text"
          placeholder="Tema principal del episodio"
          autocomplete="off"
        >

      </div>


      <div class="field episode-date-field">

        <label for="episodeDate">
          FECHA DE GRABACIÓN
        </label>

        <input
          id="episodeDate"
          type="date"
        >

      </div>

    </section>


    <!-- ===================================================
         ÁREA DE PRODUCCIÓN
    ==================================================== -->

    <section class="main-grid">


      <!-- PAUTA -->

      <section class="panel pauta-panel">

        <div class="panel-header">

          <div>

            <span class="section-label">
              PRODUCCIÓN
            </span>

            <h2>
              Pauta
            </h2>

          </div>


          <button
            id="addBlockBtn"
            class="secondary-button"
            type="button"
          >
            + Bloque
          </button>

        </div>


        <div
          id="pautaList"
          class="pauta-list"
        >
        </div>

      </section>


      <!-- GRABACIÓN -->

      <section class="panel recording-panel">

        <div class="recording-top">

          <span
            id="recordingStatus"
            class="recording-status"
          >
            LISTO PARA GRABAR
          </span>


          <span
            id="currentBlockBadge"
            class="block-badge"
          >
            Apertura
          </span>

        </div>


        <div
          id="timer"
          class="timer"
          aria-live="polite"
        >
          00:00:00
        </div>


        <div class="recording-controls">

          <button
            id="startBtn"
            class="button start-button"
            type="button"
          >
            ● INICIAR
          </button>


          <button
            id="pauseBtn"
            class="button dark-button"
            type="button"
            disabled
          >
            PAUSAR
          </button>


          <button
            id="finishBtn"
            class="button dark-button"
            type="button"
            disabled
          >
            FINALIZAR
          </button>

        </div>


        <button
          id="markBtn"
          class="mark-button"
          type="button"
          disabled
        >
          ✂ MARCAR PARA EDICIÓN
        </button>


        <div class="next-area">

          <span>
            BLOQUE ACTUAL
          </span>


          <strong id="currentBlock">
            Apertura
          </strong>


          <button
            id="nextBlockBtn"
            class="next-button"
            type="button"
          >
            SIGUIENTE BLOQUE →
          </button>

        </div>

      </section>


      <!-- MARCAS -->

      <section class="panel marks-panel">

        <div class="panel-header">

          <div>

            <span class="section-label">
              POSTPRODUCCIÓN
            </span>

            <h2>
              Marcas
            </h2>

          </div>


          <span
            id="markCount"
            class="counter"
          >
            0
          </span>

        </div>


        <div
          id="marksList"
          class="marks-list"
        >
        </div>

      </section>

    </section>


    <!-- ===================================================
         NOTAS
    ==================================================== -->

    <section class="panel notes-panel">

      <div class="panel-header">

        <div>

          <span class="section-label">
            EPISODIO
          </span>

          <h2>
            Notas
          </h2>

        </div>


        <button
          id="newSessionBtn"
          class="danger-outline-button"
          type="button"
        >
          NUEVA SESIÓN
        </button>

      </div>


      <textarea
        id="episodeNotes"
        placeholder="Ideas, recordatorios, observaciones para edición, canciones pendientes..."
      ></textarea>

    </section>

  </main>


  <!-- =====================================================
       MODAL MARCA DE EDICIÓN
  ====================================================== -->

  <div
    id="markModal"
    class="modal hidden"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalMarkTime"
  >

    <div class="modal-card">

      <span class="section-label">
        MARCA DE EDICIÓN
      </span>


      <h2 id="modalMarkTime">
        00:00:00
      </h2>


      <p id="modalMarkBlock">
        Apertura
      </p>


      <label for="markNote">
        ¿Qué hay que revisar?
      </label>


      <textarea
        id="markNote"
        placeholder="Ej: cortar silencio, repetir frase, bajar volumen..."
      ></textarea>


      <div class="modal-actions">

        <button
          id="cancelMarkBtn"
          class="button dark-button"
          type="button"
        >
          CANCELAR
        </button>


        <button
          id="saveMarkBtn"
          class="button start-button"
          type="button"
        >
          GUARDAR MARCA
        </button>

      </div>

    </div>

  </div>


  <!-- JAVASCRIPT -->
  <script src="./studio.js"></script>

</body>
</html>
