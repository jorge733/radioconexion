<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Radio Conexión Studio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #101114;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    .studio {
      text-align: center;
      padding: 40px;
    }

    .badge {
      display: inline-block;
      padding: 7px 14px;
      margin-bottom: 20px;
      border: 1px solid #555;
      border-radius: 20px;
      font-size: 13px;
      letter-spacing: 1px;
    }

    h1 {
      margin: 0;
      font-size: clamp(36px, 7vw, 72px);
      letter-spacing: -2px;
    }

    p {
      margin-top: 14px;
      color: #aaa;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <main class="studio">

    <div class="badge">
      PRODUCCIÓN
    </div>

    <h1>RADIO CONEXIÓN STUDIO</h1>

    <p>Conectados Con Tus Sentidos</p>

  </main>

</body>
</html>
