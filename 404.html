<!DOCTYPE html>
<html lang="es-419">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#d99614">
    <title>Página no encontrada | Radio Conexión</title>
    <link rel="icon" type="image/png" href="https://www.dropbox.com/scl/fi/7h2pubomnn102d1rap4dr/Sin-Texto-versi-n-3D.png?rlkey=nd66shyykgea25m8c6sl2pp5d&amp;st=dg874wjl&amp;raw=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Unica+One&display=swap" rel="stylesheet">
    <script>try{var t=localStorage.getItem('theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('rc-dark')}catch(e){}</script>
    <style>
        :root { --bg: #f4f6f8; --ink: #17191d; --muted: #596058; --gold: #c77f0d; }
        html.rc-dark { --bg: #101216; --ink: #f4f5f7; --muted: #b9bec6; --gold: #e8b850; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--ink); text-align: center; }
        main { max-width: 520px; }
        .code { font: 400 clamp(72px, 20vw, 128px)/1 'Unica One', sans-serif; color: var(--gold); }
        h1 { margin: 8px 0 12px; font-size: clamp(24px, 6vw, 32px); }
        p { margin: 0 0 28px; color: var(--muted); line-height: 1.6; }
        nav { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
        a { min-height: 44px; display: inline-flex; align-items: center; padding: 0 22px; border-radius: 999px; font-weight: 600; text-decoration: none; color: var(--ink); border: 1px solid color-mix(in srgb, var(--gold) 55%, transparent); }
        a.primary { background: linear-gradient(135deg, #f1b72b, #d99614); color: #1a160c; border: 0; }
        a:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <div class="code" aria-hidden="true">404</div>
        <h1>Esta frecuencia no está al aire</h1>
        <p>La página que buscas no existe o cambió de lugar. Te dejamos algunos caminos para volver a conectar.</p>
        <nav aria-label="Enlaces principales">
            <a class="primary" href="/inicio">Ir al inicio</a>
            <a href="/episodios">Escuchar episodios</a>
            <a href="/blog">Leer el blog</a>
        </nav>
    </main>
</body>
</html>
